title: Shell Or Suspicious Tool Spawned By PHP Or Web Worker (Linux)
id: b43dc801-37cc-4a97-b645-77bfbb926f73
status: experimental
description: >
    Detects shells, interpreters and command-line utilities started
    directly by PHP runtimes or web server workers on Linux. May indicate
    command execution following exploitation (e.g. a memory-corruption RCE
    in a PHP worker). Not CVE-specific.
references:
    - https://jackalsyn.com/posts/php-up-2026.html
author: Andrea Ceresoni
date: 2026/10/21
tags:
    - attack.execution
    - attack.t1059.004
    - attack.t1505.003
logsource:
    product: linux
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '/php-fpm'
            - '/php-cgi'
            - '/php'
            - '/lsphp'
            - '/frankenphp'
            - '/apache2'
            - '/httpd'
            - '/nginx'
            - '/caddy'
    # php-fpm is often suffixed with the version (php-fpm8.2); catch those too.
    selection_parent_versioned:
        ParentImage|contains:
            - '/php-fpm'
            - '/lsphp'
    selection_child:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/dash'
            - '/ash'
            - '/zsh'
            - '/ksh'
            - '/busybox'
            - '/curl'
            - '/wget'
            - '/nc'
            - '/ncat'
            - '/socat'
            - '/python'
            - '/python3'
            - '/perl'
            - '/ruby'
            - '/php'
            - '/env'
            - '/awk'
            - '/find'
            - '/xargs'
            - '/base64'
    condition: (selection_parent or selection_parent_versioned) and selection_child
falsepositives:
    - Applications legitimately executing shell commands or utilities
    - PHP mail delivery invoking sendmail through a shell
    - Build, deploy and cron tooling using base64/find/xargs
    - Authorized administration and security testing
level: medium
